name: CD

# Reusable: called by pipeline.yml (the "CD" box) after CI passed, on main only.
# cd-images builds the ARM64 images to this repo owner's GHCR; cd-deploy renders
# the Dennis stack onto this repo's `denis-deploy` branch, calls the Portainer
# webhook and waits until live. Only the built-in GITHUB_TOKEN is used: no
# personal token is stored in GitHub. Setup: docs/guides/deploy-denis.md.

on:
  workflow_call:

permissions:
  contents: read

env:
  DEPLOY_BRANCH: denis-deploy

jobs:
  # One image per service, ARM64 (Dennis is Ampere). Cross-built with QEMU on
  # x86 by default; set the repo variable CD_RUNNER=ubuntu-24.04-arm to build
  # natively if your plan has ARM runners for private repos.
  cd-images:
    name: cd-images (${{ matrix.service }})
    runs-on: ${{ vars.CD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    environment: production
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        service: [backend, agents, frontend, reg-memory, mlflow, mlflow-seed, model-gateway, sandbox]
    env:
      NAMESPACE: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR (built-in token)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: mnamon/${{ matrix.service }}
          # model-gateway and sandbox share mnamon/shared (modelaccess).
          build-contexts: |
            shared=mnamon/shared
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ env.NAMESPACE }}/genai-summit_${{ matrix.service }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ env.NAMESPACE }}/genai-summit_${{ matrix.service }}:main
          build-args: |
            APP_VERSION=${{ steps.tag.outputs.tag }}
            VITE_USE_MOCKS=false
            VITE_LANGFUSE_URL=${{ vars.DENIS_LANGFUSE_URL }}
            VITE_LANGFUSE_PROJECT_ID=${{ vars.DENIS_LANGFUSE_PROJECT_ID }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # Deploys what cd-images published; builds nothing.
  cd-deploy:
    name: cd-deploy
    needs: [cd-images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.DENIS_SITE_URL }}
    permissions:
      contents: write
    concurrency:
      group: deploy-denis
      cancel-in-progress: false
    env:
      NAMESPACE: ${{ github.repository_owner }}
      SITE: ${{ vars.DENIS_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the deploy settings
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          missing=0
          for v in SITE WEBHOOK; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set (docs/guides/deploy-denis.md)"; missing=1; fi
          done
          exit "$missing"
      - name: Render the stack for this release
        run: |
          tag="sha-${GITHUB_SHA::12}"
          mkdir -p out
          sed -e "s/__GHCR_NAMESPACE__/${NAMESPACE}/g" -e "s/__IMAGE_TAG__/${tag}/g" \
            deploy/denis/docker-compose-denis.yaml > out/docker-compose-denis.yaml
          if grep -q '__[A-Z_]*__' out/docker-compose-denis.yaml; then
            echo "::error::unreplaced placeholder in the rendered stack"; exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      # A push made with GITHUB_TOKEN never triggers another workflow run, and
      # pipeline.yml only runs on main anyway, so this cannot loop.
      - name: Push it to the denis-deploy branch (Portainer pulls this)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" "$DEPLOY_BRANCH" >/dev/null; then
            git clone --depth 1 --branch "$DEPLOY_BRANCH" "$url" deploy-repo
          else
            git init -q -b "$DEPLOY_BRANCH" deploy-repo
            git -C deploy-repo remote add origin "$url"
          fi
          cp out/docker-compose-denis.yaml deploy-repo/docker-compose-denis.yaml
          cd deploy-repo
          git config user.name "genai-summit-cd"
          git config user.email "genai-summit-cd@users.noreply.github.com"
          git add docker-compose-denis.yaml
          if git diff --cached --quiet; then
            echo "Stack unchanged."
          else
            git commit -q -m "deploy: genai-summit ${TAG}"
            git push origin "HEAD:${DEPLOY_BRANCH}"
          fi
      - name: Tell Portainer to pull and redeploy
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: curl -fsS --max-time 60 --retry 3 --retry-all-errors -X POST -o /dev/null "$WEBHOOK"
      - name: Wait until the release is live
        run: |
          deadline=$((SECONDS + 1200))
          while :; do
            live=$(curl -fsS --max-time 10 "$SITE/api/health" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin).get("version", ""))' 2>/dev/null || true)
            if [ "$live" = "$TAG" ]; then echo "Live: backend $live"; exit 0; fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Not live after 20 min (backend '${live:-none}', want $TAG). Check the stack in Portainer; a failed update rolls back."
              exit 1
            fi
            echo "Waiting: backend ${live:-none} -> $TAG"; sleep 20
          done
