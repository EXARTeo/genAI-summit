name: CI/CD

# Two stages, shown as two boxes: CI (ci.yml) then CD (cd.yml).
# CD runs only on main (push or Run workflow), only after CI passed, and only
# when the repo variable DENIS_DEPLOY_ENABLED is "true".
# Setup and secrets: docs/guides/deploy-denis.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  # A newer push supersedes CI, but never cancels a deploy half-way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # CI is switched off for the hackathon deadline so CD builds straight away.
  # To turn it back on: uncomment this job and `needs: [ci]` below.
  # ci:
  #   name: CI
  #   uses: ./.github/workflows/ci.yml

  cd:
    name: CD
    # needs: [ci]
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && vars.DENIS_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/cd.yml
    secrets: inherit
    # The caller must grant what cd.yml's jobs ask for (GHCR push).
    permissions:
      contents: read
      packages: write
