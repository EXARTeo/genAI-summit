name: CI/CD

# CI: every job below up to `compose` (tests, lint, migrations, compose files).
# CD: `cd-images` + `cd-deploy`, only on main (push or Run workflow), only after
#     every CI job passed, and only when the repo variable DENIS_DEPLOY_ENABLED
#     is "true". Builds ARM64 images to GHCR, renders the Dennis stack into the
#     deploy repo Portainer pulls, calls the stack webhook, waits until live.
#     Setup and secrets: docs/guides/deploy-denis.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  # A newer push supersedes CI, but never cancels a deploy half-way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ===================================================================== CI ==
  lint-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run python -m pytest

  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mnamon/backend
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv venv .venv && uv pip install -r requirements.txt
      # The migrations apply to a real Postgres and match the ORM models.
      - run: .venv/bin/python -m alembic upgrade head
      - run: .venv/bin/python -m alembic check
      - run: .venv/bin/python -m alembic downgrade base
      # The unit suite (tests/backend) uses its own SQLite + fakeredis, not the service above.
      - run: .venv/bin/python -m pytest ../../tests/backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-bootstrap.db

  agents:
    name: Agents service tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv venv mnamon/agents/.venv && uv pip install --python mnamon/agents/.venv/bin/python -r mnamon/agents/requirements.txt
      # No real OpenAI, Postgres or Redis: fakes and fakeredis.
      - run: mnamon/agents/.venv/bin/python -m pytest tests/agents

  reg-memory:
    name: reg-memory tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv venv mnamon/reg-memory/.venv && uv pip install --python mnamon/reg-memory/.venv/bin/python -r mnamon/reg-memory/requirements.txt
      # No network: every fetch goes through httpx.MockTransport.
      - run: mnamon/reg-memory/.venv/bin/python -m pytest tests/reg_memory

  model-gateway:
    name: model-gateway tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv venv mnamon/model-gateway/.venv && uv pip install --python mnamon/model-gateway/.venv/bin/python -r mnamon/model-gateway/requirements.txt
      # No MLflow: the model loader is faked.
      - run: mnamon/model-gateway/.venv/bin/python -m pytest tests/model_gateway

  sandbox:
    name: sandbox tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv venv mnamon/sandbox/.venv && uv pip install --python mnamon/sandbox/.venv/bin/python -r mnamon/sandbox/requirements.txt && uv pip install --python mnamon/sandbox/.venv/bin/python -e mnamon/sandbox/synthkit
      # No network: a local sklearn model and httpx.MockTransport; real subprocesses.
      - run: mnamon/sandbox/.venv/bin/python -m pytest tests/sandbox

  mlflow-seed:
    name: mlflow-seed tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv venv mnamon/mlflow-seed/.venv && uv pip install --python mnamon/mlflow-seed/.venv/bin/python -r mnamon/mlflow-seed/requirements.txt
      # No MLflow server: small builds plus a sqlite store in tmp_path.
      - run: mnamon/mlflow-seed/.venv/bin/python -m pytest tests/mlflow_seed

  frontend:
    name: frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mnamon/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mnamon/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  compose:
    name: Validate docker compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          files=$(find . \( -name 'docker-compose*.y*ml' -o -name 'compose*.y*ml' \) -not -path './.git/*' -not -path './deploy/*')
          if [ -z "$files" ]; then
            echo "No compose files yet; skipping."
            exit 0
          fi
          # The repo's single .env.example supplies the variables.
          for f in $files; do
            echo "::group::$f"
            docker compose -f "$f" --env-file .env.example config --quiet
            echo "::endgroup::"
          done
      # The Dennis stack: valid with every required Portainer variable set.
      - name: docker compose config (deploy/denis)
        env:
          SITE_URL: https://example.invalid
          LOG_REDACTION_SECRET: x
          POSTGRES_PASSWORD: x
          REDIS_PASSWORD: x
          AGENTS_INTERNAL_SECRET: x
          REG_MEMORY_INTERNAL_SECRET: x
          LANGFUSE_PUBLIC_KEY: x
          LANGFUSE_SECRET_KEY: x
          GOOGLE_API_KEY: x
          LANGGRAPH_AES_KEY: x
          MODEL_GATEWAY_TOKEN: x
        run: docker compose -f deploy/denis/docker-compose-denis.yaml config --quiet

  # ===================================================================== CD ==
  # One image per service, ARM64 (Dennis is Ampere). Cross-built with QEMU on
  # x86 by default; set the repo variable CD_RUNNER=ubuntu-24.04-arm to build
  # natively if your plan has ARM runners for private repos.
  cd-images:
    name: cd-images (${{ matrix.service }})
    needs: [lint-test, backend, agents, reg-memory, model-gateway, sandbox, mlflow-seed, frontend, compose]
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && vars.DENIS_DEPLOY_ENABLED == 'true'
    runs-on: ${{ vars.CD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    environment: production
    strategy:
      fail-fast: true
      matrix:
        service: [backend, agents, frontend, reg-memory, mlflow, mlflow-seed, model-gateway, sandbox]
    env:
      NAMESPACE: ${{ vars.GHCR_NAMESPACE || 'konstantinosmpouros' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR (as the namespace owner)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.NAMESPACE }}
          password: ${{ secrets.DENIS_GHCR_TOKEN }}
      - name: Image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: mnamon/${{ matrix.service }}
          # model-gateway and sandbox share mnamon/shared (modelaccess).
          build-contexts: |
            shared=mnamon/shared
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ env.NAMESPACE }}/genai-summit_${{ matrix.service }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ env.NAMESPACE }}/genai-summit_${{ matrix.service }}:main
          build-args: |
            APP_VERSION=${{ steps.tag.outputs.tag }}
            VITE_USE_MOCKS=false
            VITE_LANGFUSE_URL=${{ vars.DENIS_LANGFUSE_URL }}
            VITE_LANGFUSE_PROJECT_ID=${{ vars.DENIS_LANGFUSE_PROJECT_ID }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # Deploys what cd-images published; builds nothing.
  cd-deploy:
    name: cd-deploy
    needs: [cd-images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.DENIS_SITE_URL }}
    concurrency:
      group: deploy-denis
      cancel-in-progress: false
    env:
      NAMESPACE: ${{ vars.GHCR_NAMESPACE || 'konstantinosmpouros' }}
      DEPLOY_REPO: ${{ vars.DENIS_DEPLOY_REPO }}
      SITE: ${{ vars.DENIS_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the deploy settings
        env:
          TOKEN: ${{ secrets.DENIS_DEPLOY_TOKEN }}
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          missing=0
          for v in DEPLOY_REPO SITE TOKEN WEBHOOK; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set (docs/guides/deploy-denis.md)"; missing=1; fi
          done
          exit "$missing"
      - name: Render the stack for this release
        run: |
          tag="sha-${GITHUB_SHA::12}"
          mkdir -p out
          sed -e "s/__GHCR_NAMESPACE__/${NAMESPACE}/g" -e "s/__IMAGE_TAG__/${tag}/g" \
            deploy/denis/docker-compose-denis.yaml > out/docker-compose-denis.yaml
          if grep -q '__[A-Z_]*__' out/docker-compose-denis.yaml; then
            echo "::error::unreplaced placeholder in the rendered stack"; exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Push it to the deploy repo (Portainer pulls this)
        env:
          TOKEN: ${{ secrets.DENIS_DEPLOY_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${DEPLOY_REPO}.git" deploy-repo
          cp out/docker-compose-denis.yaml deploy-repo/docker-compose-denis.yaml
          cd deploy-repo
          git config user.name "genai-summit-cd"
          git config user.email "genai-summit-cd@users.noreply.github.com"
          git add docker-compose-denis.yaml
          if git diff --cached --quiet; then
            echo "Stack unchanged."
          else
            git commit -m "deploy: genai-summit ${TAG}"
            git push origin HEAD
          fi
      - name: Tell Portainer to pull and redeploy
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: curl -fsS --max-time 60 --retry 3 --retry-all-errors -X POST -o /dev/null "$WEBHOOK"
      - name: Wait until the release is live
        run: |
          deadline=$((SECONDS + 1200))
          while :; do
            live=$(curl -fsS --max-time 10 "$SITE/api/health" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin).get("version", ""))' 2>/dev/null || true)
            if [ "$live" = "$TAG" ]; then echo "Live: backend $live"; exit 0; fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Not live after 20 min (backend '${live:-none}', want $TAG). Check the stack in Portainer; a failed update rolls back."
              exit 1
            fi
            echo "Waiting: backend ${live:-none} -> $TAG"; sleep 20
          done
