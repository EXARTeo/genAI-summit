name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run python -m pytest

  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: product/backend
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv venv .venv && uv pip install -r requirements.txt
      # The migrations apply to a real Postgres and match the ORM models.
      - run: .venv/bin/python -m alembic upgrade head
      - run: .venv/bin/python -m alembic check
      - run: .venv/bin/python -m alembic downgrade base
      # The unit suite (tests/backend) uses its own SQLite + fakeredis, not the service above.
      - run: .venv/bin/python -m pytest ../../tests/backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-bootstrap.db

  agents:
    name: Agents service tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv venv product/agents/.venv && uv pip install --python product/agents/.venv/bin/python -r product/agents/requirements.txt
      # No real OpenAI, Postgres or Redis: fakes and fakeredis.
      - run: product/agents/.venv/bin/python -m pytest tests/agents

  reg-memory:
    name: reg-memory tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv venv product/reg-memory/.venv && uv pip install --python product/reg-memory/.venv/bin/python -r product/reg-memory/requirements.txt
      # No network: every fetch goes through httpx.MockTransport.
      - run: product/reg-memory/.venv/bin/python -m pytest tests/reg_memory

  model-gateway:
    name: model-gateway tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv venv product/model-gateway/.venv && uv pip install --python product/model-gateway/.venv/bin/python -r product/model-gateway/requirements.txt
      # No MLflow: the model loader is faked.
      - run: product/model-gateway/.venv/bin/python -m pytest tests/model_gateway

  sandbox:
    name: sandbox tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv venv product/sandbox/.venv && uv pip install --python product/sandbox/.venv/bin/python -r product/sandbox/requirements.txt && uv pip install --python product/sandbox/.venv/bin/python -e product/sandbox/synthkit
      # No network: a local sklearn model and httpx.MockTransport; real subprocesses.
      - run: product/sandbox/.venv/bin/python -m pytest tests/sandbox

  mlflow-seed:
    name: mlflow-seed tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv venv product/mlflow-seed/.venv && uv pip install --python product/mlflow-seed/.venv/bin/python -r product/mlflow-seed/requirements.txt
      # No MLflow server: small builds plus a sqlite store in tmp_path.
      - run: product/mlflow-seed/.venv/bin/python -m pytest tests/mlflow_seed

  frontend:
    name: frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: product/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: product/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  compose:
    name: Validate docker compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          files=$(find . \( -name 'docker-compose*.y*ml' -o -name 'compose*.y*ml' \) -not -path './.git/*')
          if [ -z "$files" ]; then
            echo "No compose files yet; skipping."
            exit 0
          fi
          # The repo's single .env.example supplies the variables.
          for f in $files; do
            echo "::group::$f"
            docker compose -f "$f" --env-file .env.example config --quiet
            echo "::endgroup::"
          done
