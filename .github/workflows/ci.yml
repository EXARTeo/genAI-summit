name: CI

# Reusable: called by pipeline.yml (the "CI" box). Tests, lint, migrations and
# compose validation, one job per service, all in parallel.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run python -m pytest

  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mnamon/backend
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv venv .venv && uv pip install -r requirements.txt
      # The migrations apply to a real Postgres and match the ORM models.
      - run: .venv/bin/python -m alembic upgrade head
      - run: .venv/bin/python -m alembic check
      - run: .venv/bin/python -m alembic downgrade base
      # The unit suite (tests/backend) uses its own SQLite + fakeredis, not the service above.
      - run: .venv/bin/python -m pytest ../../tests/backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-bootstrap.db

  agents:
    name: Agents service tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv venv mnamon/agents/.venv && uv pip install --python mnamon/agents/.venv/bin/python -r mnamon/agents/requirements.txt
      # No real OpenAI, Postgres or Redis: fakes and fakeredis.
      - run: mnamon/agents/.venv/bin/python -m pytest tests/agents

  reg-memory:
    name: reg-memory tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv venv mnamon/reg-memory/.venv && uv pip install --python mnamon/reg-memory/.venv/bin/python -r mnamon/reg-memory/requirements.txt
      # No network: every fetch goes through httpx.MockTransport.
      - run: mnamon/reg-memory/.venv/bin/python -m pytest tests/reg_memory

  model-gateway:
    name: model-gateway tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv venv mnamon/model-gateway/.venv && uv pip install --python mnamon/model-gateway/.venv/bin/python -r mnamon/model-gateway/requirements.txt
      # No MLflow: the model loader is faked.
      - run: mnamon/model-gateway/.venv/bin/python -m pytest tests/model_gateway

  sandbox:
    name: sandbox tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv venv mnamon/sandbox/.venv && uv pip install --python mnamon/sandbox/.venv/bin/python -r mnamon/sandbox/requirements.txt && uv pip install --python mnamon/sandbox/.venv/bin/python -e mnamon/sandbox/synthkit && uv pip install --python mnamon/sandbox/.venv/bin/python -e mnamon/shared/modelaccess
      # No network: a local sklearn model and httpx.MockTransport; real subprocesses.
      - run: mnamon/sandbox/.venv/bin/python -m pytest tests/sandbox

  mlflow-seed:
    name: mlflow-seed tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv venv mnamon/mlflow-seed/.venv && uv pip install --python mnamon/mlflow-seed/.venv/bin/python -r mnamon/mlflow-seed/requirements.txt
      # No MLflow server: small builds plus a sqlite store in tmp_path.
      - run: mnamon/mlflow-seed/.venv/bin/python -m pytest tests/mlflow_seed

  frontend:
    name: frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mnamon/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mnamon/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  compose:
    name: Validate docker compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config
        run: |
          files=$(find . \( -name 'docker-compose*.y*ml' -o -name 'compose*.y*ml' \) -not -path './.git/*' -not -path './deploy/*')
          if [ -z "$files" ]; then
            echo "No compose files yet; skipping."
            exit 0
          fi
          # The repo's single .env.example supplies the variables.
          for f in $files; do
            echo "::group::$f"
            docker compose -f "$f" --env-file .env.example config --quiet
            echo "::endgroup::"
          done
      # The Dennis stack: valid with every required Portainer variable set.
      - name: docker compose config (deploy/denis)
        env:
          SITE_URL: https://example.invalid
          LOG_REDACTION_SECRET: x
          POSTGRES_PASSWORD: x
          REDIS_PASSWORD: x
          AGENTS_INTERNAL_SECRET: x
          REG_MEMORY_INTERNAL_SECRET: x
          LANGFUSE_PUBLIC_KEY: x
          LANGFUSE_SECRET_KEY: x
          GOOGLE_API_KEY: x
          LANGGRAPH_AES_KEY: x
          MODEL_GATEWAY_TOKEN: x
        run: docker compose -f deploy/denis/docker-compose-denis.yaml config --quiet
