 font-size="11" font-weight="600" text-anchor="middle" fill="#9E4A17">new</text><text x="1054" y="167" font-size="13.5" font-weight="400" fill="#1B2029">plugin.yaml: access, pipeline place, I/O</text><text x="1054" y="186" font-size="13.5" font-weight="400" fill="#4A4F5A">mlflow · REST · LLM chat · dataset</text><text x="1054" y="205" font-size="13.5" font-weight="400" fill="#4A4F5A">+ docs, training-data description,</text><text x="1054" y="224" font-size="13.5" font-weight="400" fill="#4A4F5A">data dictionary, expected behaviour</text><text x="1054" y="243" font-size="13.5" font-weight="400" fill="#4A4F5A">secrets by reference only</text><rect x="40" y="375" width="420" height="130" rx="12" fill="#F4F1EA" stroke="#2F5F80" stroke-width="2"/><text x="54" y="403" font-size="17" font-weight="700" fill="#2F5F80">HITL gates</text><text x="54" y="427" font-size="13.5" font-weight="400" fill="#1B2029">Engineer / AI Officer</text><text x="54" y="446" font-size="13.5" font-weight="400" fill="#4A4F5A">approve · edit · reject + reason</text><text x="54" y="465" font-size="13.5" font-weight="400" fill="#4A4F5A">plan, datasets, findings, change judge</text><rect x="540" y="375" width="420" height="130" rx="12" fill="#F4F1EA" stroke="#9E4A17" stroke-width="2"/><text x="554" y="403" font-size="17" font-weight="700" font-family="JetBrains Mono, Consolas, monospace" fill="#9E4A17">agents: load_context</text><rect x="908.0" y="387" width="42.0" height="20" rx="10" fill="#e8dacc"/><text x="929.0" y="401" font-size="11" font-weight="600" text-anchor="middle" fill="#9E4A17">built</text><text x="554" y="427" font-size="13.5" font-weight="400" fill="#1B2029">One run context from all sources</text><text x="554" y="446" font-size="13.5" font-weight="400" fill="#4A4F5A">→ scenarios, use cases, synthetic data,</text><text x="554" y="465" font-size="13.5" font-weight="400" fill="#4A4F5A">   tests, results, findings</text><rect x="1040" y="375" width="420" height="130" rx="12" fill="#F4F1EA" s