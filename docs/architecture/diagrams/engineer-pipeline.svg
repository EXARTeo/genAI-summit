/text><text x="54" y="172" font-size="13.5" font-weight="400" fill="#0F172A">System card, MLflow model</text><text x="54" y="191" font-size="13.5" font-weight="400" fill="#64748B">Requirements from RKS</text><text x="54" y="210" font-size="13.5" font-weight="400" fill="#64748B">(provider, high, Annex III 4a)</text><rect x="310" y="120" width="220" height="130" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/><text x="324" y="148" font-size="17" font-weight="700" font-family="JetBrains Mono, Consolas, monospace" fill="#0F172A">2 plan_tests</text><text x="324" y="172" font-size="13.5" font-weight="400" fill="#0F172A">Requirement → templates</text><text x="324" y="191" font-size="13.5" font-weight="400" fill="#64748B">Each test: proves / can&#x27;t</text><text x="324" y="210" font-size="13.5" font-weight="400" fill="#64748B">Untestable → needs_docs</text><rect x="580" y="140" width="170" height="90" rx="12" fill="#FFFFFF" stroke="#14B8A6" stroke-width="2"/><text x="594" y="168" font-size="17" font-weight="700" fill="#14B8A6">HITL</text><text x="594" y="192" font-size="13.5" font-weight="400" fill="#0F172A">approve plan</text><rect x="800" y="120" width="240" height="130" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/><text x="814" y="148" font-size="17" font-weight="700" font-family="JetBrains Mono, Consolas, monospace" fill="#0F172A">3 generate_data</text><text x="814" y="172" font-size="13.5" font-weight="400" fill="#0F172A">DatasetSpec per test</text><text x="814" y="191" font-size="13.5" font-weight="400" fill="#64748B">Counterfactual twins,</text><text x="814" y="210" font-size="13.5" font-weight="400" fill="#64748B">perturbation, schema-driven</text><rect x="1090" y="140" width="170" height="90" rx="12" fill="#FFFFFF" stroke="#14B8A6" stroke-width="2"/><text x="1104" y="168" font-size="17" font-weight="700" fill="#14B8A6">HITL</text><text x="1104" y="192" font-size="13.5" font-weight="400" fill="#0F172A">audit datasets</text><path d="M260,185 L308,185" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#m4F46E5)"/><path d="M530,185 L578,185" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#m4F46E5)"/><path d="M750,185 L798,185" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#m4F46E5)"/><path d="M1040,185 L1088,185" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#m4F46E5)"/><path d="M1175,232 L1175,300 L150,300 L150,358" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#m4F46E5)"/><rect x="40" y="360" width="220" height="130" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/><text x="54" y="388" font-size="17" font-weight="700" font-family="JetBrains Mono, Consolas, monospace" fill="#0F172A">4 execute</text><text x="54" y="412" font-size="13.5" font-weight="400" fill="#0F172A">In the sandbox</text><text x="54" y="431" font-size="13.5" font-weight="400" fill="#64748B">One MLflow run per test</text><text x="54" y="450" font-size="13.5" font-weight="400" fill="#64748B">bootstrap CI on metrics</text><rect x="310" y="360" width="220" height="130" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/><text x="324" y="388" font-size="17" font-weight="700" font-family="JetBrains Mono, Consolas, monospace" fill="#0F172A">5 analyse</text><text x="324" y="412" font-size="13.5" font-weight="400" fill="#0F172A">Findings: verdict,</text><text x="324" y="431" font-size="13.5" font-weight="400" fill="#64748B">confidence, evidence,</text><text x="324" y="450" font-size="13.5" font-weight="400" fill="#64748B">reasoning</text><rect x="580" y="360" width="220" height="130" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/><text x="594" y="388" font-size="17" font-weight="700" font-family="JetBrains Mono, Consolas, monospace" fill="#0F172A">6 critic</text><text x="594" y="412" font-size="13.5" font-weight="400" fill="#0F172A">Tries to overturn</text><text x="594" y="431" font-size="13.5" font-weight="400" fill="#64748B">each finding; verdict</text><text x="594" y="450" font-size="13.5" font-weight="400" fill="#64748B">adjusted, conflicts shown</text><rect x="850" y="360" width="220" height="130" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/><text x="864" y="388" font-size="17" font-weight="700" font-family="JetBrains Mono, Consolas, monospace" fill="#0F172A">7 report</text><text x="864" y="412" font-size="13.5" font-weight="400" fill="#0F172A">Two audiences,</text><text x="864" y="431" font-size="13.5" font-weight="400" fill="#64748B">same evidence</text><path d="M260,425 L308,425" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#m4F46E5)"/><path d="M530,425 L578,425" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#m4F46E5)"/><path d="M800,425 L848,425" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#m4F46E5)"/><path d="M690,492 L690,520 L420,520 L420,492" fill="none" stroke="#14B8A6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m14B8A6)"/><rect x="514.0" y="521.5" width="82.0" height="21.5" rx="5" fill="#FFFFFF"/><text x="555.0" y="537.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#14B8A6">challenges</text><rect x="1120" y="340" width="340" height="80" rx="12" fill="#F5F5F7" stroke="#14B8A6" stroke-width="2"/><text x="1134" y="368" font-size="17" font-weight="700" fill="#0F172A">Engineer report</text><text x="1134" y="392" font-size="13.5" font-weight="400" fill="#0F172A">run ids, seeds, code: reproducible</text><rect x="1120" y="430" width="340" height="80" rx="12" fill="#F5F5F7" stroke="#14B8A6" stroke-width="2"/><text x="1134" y="458" font-size="17" font-weight="700" fill="#0F172A">Management report</text><text x="1134" y="482" font-size="13.5" font-weight="400" fill="#0F172A">traffic light per requirement, top risks</text><path d="M1070,410 L1118,380" fill="none" stroke="#14B8A6" stroke-width="2" marker-end="url(#m14B8A6)"/><path d="M1070,440 L1118,470" fill="none" stroke="#14B8A6" stroke-width="2" marker-end="url(#m14B8A6)"/><text x="40" y="580" font-size="15" font-weight="700" fill="#0F172A">Finding verdicts</text><text x="40" y="606" font-size="14" font-weight="400" font-family="JetBrains Mono, Consolas, monospace" fill="#64748B">supports_compliance · indicates_gap · inconclusive · not_assessable_by_testing</text><text x="40" y="640" font-size="14" font-weight="400" fill="#64748B">Each MLflow run is tagged req_ids, card_version, kb_version, dataset_id. Thresholds are the organisation&#x27;s, not the law&#x27;s.</text><text x="40" y="664" font-size="14" font-weight="400" fill="#14B8A6">Every node and tool call is a Langfuse span: the judges can replay the whole run.</text></svg>
