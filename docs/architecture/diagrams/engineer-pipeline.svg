<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" font-family="Inter, &#x27;Segoe UI&#x27;, Arial, sans-serif"><defs><marker id="m9E4A17" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9E4A17"/></marker><marker id="m9E4A17s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#9E4A17"/></marker><marker id="m1B2029" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1B2029"/></marker><marker id="m1B2029s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1B2029"/></marker><marker id="m2F5F80" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F5F80"/></marker><marker id="m2F5F80s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2F5F80"/></marker><marker id="m4A4F5A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4A4F5A"/></marker><marker id="m4A4F5As" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#4A4F5A"/></marker></defs><rect x="0" y="0" width="1500" height="900" rx="0" fill="#F4F1EA"/><text x="40" y="52" font-size="28" font-weight="700" fill="#1B2029">Engineer pipeline</text><text x="40" y="80" font-size="15" font-weight="400" fill="#4A4F5A">LangGraph test pipeline: system card + model in, findings and two reports out</text><rect x="40" y="120" width="210" height="130" rx="12" fill="#F4F1EA" stroke="#9E4A17" stroke-width="2"/><text x="54" y="148" font-size="17" font-weight="700" font-family="JetBrains Mono, Consolas, monospace" fill="#1B2029">1 load_context</text><text x="54" y="172" font-size="13.5" font-weight="400" fill="#1B2029">System card, plugin, model</text><text x="54" y="191" font-size="13.5" font-weight="400" fill="#4A4F5A">Requirements from RKS</text><text x="54" y="210" font-size="13.5" font-weight="400" fill="#4A4F5A">(provider, high, Annex III)</text><rect x="295" y="120" width="210" height="130" rx="12" fill="#F4F1EA" stroke="#9E4A17" stroke-width="2"/><text x="309" y="148" font-size="17" font-weight="700" font-family="JetBrains Mono, Consolas, monospace" fill="#1B2029">2 profile_model</text><text x="309" y="172" font-size="13.5" font-weight="400" fill="#1B2029">Sandbox probes the model:</text><text x="309" y="191" font-size="13.5" font-weight="400" fill="#4A4F5A">what moves the output,</text><text x="309" y="210" font-size="13.5" font-weight="400" fill="#4A4F5A">proxies, monotonicity</text><rect x="550" y="120" width="210" height="130" rx="12" fill="#F4F1EA" stroke="#9E4A17" stroke-width="2"/><text x="564" y="148" font-size="17" font-weight="700" font-family="JetBrains Mono, Consolas, monospace" fill="#1B2029">3 plan_scenarios</text><text x="564" y="172" font-size="13.5" font-weight="400" fill="#1B2029">Requirement → test</text><text x="564" y="191" font-size="13.5" font-weight="400" fill="#4A4F5A">scenarios from the profile</text><text x="564" y="210" font-size="13.5" font-weight="400" fill="#4A4F5A">and the memory</text><rect x="805" y="120" width="210" height="130" rx="12" fill="#F4F1EA" stroke="#9E4A17" stroke-width="2"/><text x="819" y="148" font-size="17" font-weight="700" font-family="JetBrains Mono, Consolas, monospace" fill="#1B2029">4 analyse_scenarios</text><text x="819" y="172" font-size="13.5" font-weight="400" fill="#1B2029">synthkit scenarios-check</text><text x="819" y="191" font-size="13.5" font-weight="400" fill="#4A4F5A">Oumi Iris reviews each</text><text x="819" y="210" font-size="13.5" font-weight="400" fill="#4A4F5A">scenario (Gemini fallback)</text><rect x="1060" y="140" width="160" height="90" rx="12" fill="#F4F1EA" stroke="#2F5F80" stroke-width="2"/><text x="1074" y="168" font-size="17" font-weight="700" fill="#2F5F80">HITL</text><text x="1074" y="192" font-size="13.5" font-weight="400" fill="#1B2029">approve scenarios</text><path d="M250,185 L293,185" fill="none" stroke="#9E4A17" stroke-width="2" marker-end="url(#m9E4A17)"/><path d="M505,185 L548,185" fill="none" stroke="#9E4A17" stroke-width="2" marker-end="url(#m9E4A17)"/><path d="M760,185 L803,185" fill="none" stroke="#9E4A17" stroke-width="2" marker-end="url(#m9E4A17)"/><path d="M1015,185 L1058,185" fill="none" stroke="#9E4A17" stroke-width="2" marker-end="url(#m9E4A17)"/><path d="M910,252 L910,278 L655,278 L655,252" fill="none" stroke="#2F5F80" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m2F5F80)"/><rect x="671.5" y="279.5" width="222.00000000000003" height="21.5" rx="5" fill="#F4F1EA"/><text x="782.5" y="295.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#2F5F80">needs_change / gaps: redo once</text><path d="M1140,232 L1140,305 L145,305 L145,338" fill="none" stroke="#9E4A17" stroke-width="2" marker-end="url(#m9E4A17)"/><rect x="40" y="340" width="210" height="130" rx="12" fill="#F4F1EA" stroke="#9E4A17" stroke-width="2"/><text x="54" y="368" font-size="17" font-weight="700" font-family="JetBrains Mono, Consolas, monospace" fill="#1B2029">5 find_public_data</text><text x="54" y="392" font-size="13.5" font-weight="400" fill="#1B2029">Datasets that carry the</text><text x="54" y="411" font-size="13.5" font-weight="400" fill="#4A4F5A">approved scenarios&#x27; fields</text><text x="54" y="430" font-size="13.5" font-weight="400" fill="#4A4F5A">and protected attributes</text><rect x="295" y="360" width="160" height="90" rx="12" fill="#F4F1EA" stroke="#2F5F80" stroke-width="2"/><text x="309" y="388" font-size="17" font-weight="700" fill="#2F5F80">HITL</text><text x="309" y="412" font-size="13.5" font-weight="400" fill="#1B2029">pick public data</text><rect x="500" y="340" width="240" height="130" rx="12" fill="#F4F1EA" stroke="#9E4A17" stroke-width="2"/><text x="514" y="368" font-size="17" font-weight="700" font-family="JetBrains Mono, Consolas, monospace" fill="#1B2029">6 draft_spec + data</text><text x="514" y="392" font-size="13.5" font-weight="400" fill="#1B2029">Spec: reference sample</text><text x="514" y="411" font-size="13.5" font-weight="400" fill="#4A4F5A">or zero-shot; twins,</text><text x="514" y="430" font-size="13.5" font-weight="400" fill="#4A4F5A">perturbation, edge cases</text><rect x="785" y="360" width="160" height="90" rx="12" fill="#F4F1EA" stroke="#2F5F80" stroke-width="2"/><text x="799" y="388" font-size="17" font-weight="700" fill="#2F5F80">HITL</text><text x="799" y="412" font-size="13.5" font-weight="400" fill="#1B2029">approve datasets</text><path d="M250,405 L293,405" fill="none" stroke="#9E4A17" stroke-width="2" marker-end="url(#m9E4A17)"/><path d="M455,405 L498,405" fill="none" stroke="#9E4A17" stroke-width="2" marker-end="url(#m9E4A17)"/><path d="M740,405 L783,405" fill="none" stroke="#9E4A17" stroke-width="2" marker-end="url(#m9E4A17)"/><path d="M865,452 L865,525 L145,525 L145,558" fill="none" stroke="#9E4A17" stroke-width="2" marker-end="url(#m9E4A17)"/><rect x="40" y="560" width="210" height="130" rx="12" fill="#F4F1EA" stroke="#9E4A17" stroke-width="2"/><text x="54" y="588" font-size="17" font-weight="700" font-family="JetBrains Mono, Consolas, monospace" fill="#1B2029">7 run_tests</text><text x="54" y="612" font-size="13.5" font-weight="400" fill="#1B2029">In the sandbox</text><text x="54" y="631" font-size="13.5" font-weight="400" fill="#4A4F5A">One MLflow run per test</text><text x="54" y="650" font-size="13.5" font-weight="400" fill="#4A4F5A">bootstrap CI on metrics</text><rect x="295" y="560" width="210" height="130" rx="12" fill="#F4F1EA" stroke="#9E4A17" stroke-width="2"/><text x="309" y="588" font-size="17" font-weight="700" font-family="JetBrains Mono, Consolas, monospace" fill="#1B2029">8 analyse</text><text x="309" y="612" font-size="13.5" font-weight="400" fill="#1B2029">Findings: verdict,</text><text x="309" y="631" font-size="13.5" font-weight="400" fill="#4A4F5A">confidence, evidence,</text><text x="309" y="650" font-size="13.5" font-weight="400" fill="#4A4F5A">reasoning</text><rect x="550" y="560" width="210" height="130" rx="12" fill="#F4F1EA" stroke="#9E4A17" stroke-width="2"/><text x="564" y="588" font-size="17" font-weight="700" font-family="JetBrains Mono, Consolas, monospace" fill="#1B2029">9 critic</text><text x="564" y="612" font-size="13.5" font-weight="400" fill="#1B2029">Tries to overturn</text><text x="564" y="631" font-size="13.5" font-weight="400" fill="#4A4F5A">each finding; verdict</text><text x="564" y="650" font-size="13.5" font-weight="400" fill="#4A4F5A">adjusted, conflicts shown</text><rect x="805" y="560" width="210" height="130" rx="12" fill="#F4F1EA" stroke="#9E4A17" stroke-width="2"/><text x="819" y="588" font-size="17" font-weight="700" font-family="JetBrains Mono, Consolas, monospace" fill="#1B2029">10 report</text><text x="819" y="612" font-size="13.5" font-weight="400" fill="#1B2029">Two audiences,</text><text x="819" y="631" font-size="13.5" font-weight="400" fill="#4A4F5A">same evidence</text><path d="M250,625 L293,625" fill="none" stroke="#9E4A17" stroke-width="2" marker-end="url(#m9E4A17)"/><path d="M505,625 L548,625" fill="none" stroke="#9E4A17" stroke-width="2" marker-end="url(#m9E4A17)"/><path d="M760,625 L803,625" fill="none" stroke="#9E4A17" stroke-width="2" marker-end="url(#m9E4A17)"/><path d="M655,692 L655,720 L400,720 L400,692" fill="none" stroke="#2F5F80" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m2F5F80)"/><rect x="486.5" y="721.5" width="82.0" height="21.5" rx="5" fill="#F4F1EA"/><text x="527.5" y="737.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#2F5F80">challenges</text><rect x="1080" y="540" width="380" height="80" rx="12" fill="#FBF9F4" stroke="#2F5F80" stroke-width="2"/><text x="1094" y="568" font-size="17" font-weight="700" fill="#1B2029">Engineer report</text><text x="1094" y="592" font-size="13.5" font-weight="400" fill="#1B2029">run ids, seeds, code: reproducible</text><rect x="1080" y="630" width="380" height="80" rx="12" fill="#FBF9F4" stroke="#2F5F80" stroke-width="2"/><text x="1094" y="658" font-size="17" font-weight="700" fill="#1B2029">Management report</text><text x="1094" y="682" font-size="13.5" font-weight="400" fill="#1B2029">traffic light per requirement, top risks</text><path d="M1015,610 L1078,580" fill="none" stroke="#2F5F80" stroke-width="2" marker-end="url(#m2F5F80)"/><path d="M1015,640 L1078,670" fill="none" stroke="#2F5F80" stroke-width="2" marker-end="url(#m2F5F80)"/><text x="40" y="780" font-size="15" font-weight="700" fill="#1B2029">Finding verdicts</text><text x="40" y="806" font-size="14" font-weight="400" font-family="JetBrains Mono, Consolas, monospace" fill="#4A4F5A">supports_compliance · indicates_gap · inconclusive · not_assessable_by_testing</text><text x="40" y="840" font-size="14" font-weight="400" fill="#4A4F5A">Each MLflow run is tagged req_ids, card_version, kb_version, dataset_id. Thresholds are the organisation&#x27;s, not the law&#x27;s.</text><text x="40" y="864" font-size="14" font-weight="400" fill="#2F5F80">Every node, tool call and Iris decision (iris.decide) is a Langfuse span: the judges can replay the whole run.</text></svg>
