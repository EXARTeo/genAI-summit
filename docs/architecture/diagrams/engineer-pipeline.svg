ct</text><text x="594" y="450" font-size="13.5" font-weight="400" fill="#4A4F5A">adjusted, conflicts shown</text><rect x="850" y="360" width="220" height="130" rx="12" fill="#F4F1EA" stroke="#9E4A17" stroke-width="2"/><text x="864" y="388" font-size="17" font-weight="700" font-family="JetBrains Mono, Consolas, monospace" fill="#1B2029">7 report</text><text x="864" y="412" font-size="13.5" font-weight="400" fill="#1B2029">Two audiences,</text><text x="864" y="431" font-size="13.5" font-weight="400" fill="#4A4F5A">same evidence</text><path d="M260,425 L308,425" fill="none" stroke="#9E4A17" stroke-width="2" marker-end="url(#m9E4A17)"/><path d="M530,425 L578,425" fill="none" stroke="#9E4A17" stroke-width="2" marker-end="url(#m9E4A17)"/><path d="M800,425 L848,425" fill="none" stroke="#9E4A17" stroke-width="2" marker-end="url(#m9E4A17)"/><path d="M690,492 L690,520 L420,520 L420,492" fill="none" stroke="#2F5F80" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m2F5F80)"/><rect x="514.0" y="521.5" width="82.0" height="21.5" rx="5" fill="#F4F1EA"/><text x="555.0" y="537.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#2F5F80">challenges</text><rect x="1120" y="340" width="340" height="80" rx="12" fill="#FBF9F4" stroke="#2F5F80" stroke-width="2"/><text x="1134" y="368" font-size="17" font-weight="700" fill="#1B2029">Engineer report</text><text x="1134" y="392" font-size="13.5" font-weight="400" fill="#1B2029">run ids, seeds, code: reproducible</text><rect x="1120" y="430" width="340" height="80" rx="12" fill="#FBF9F4" stroke="#2F5F80" stroke-width="2"/><text x="1134" y="458" font-size="17" font-weight="700" fill="#1B2029">Management report</text><text x="1134" y="482" font-size="13.5" font-weight="400" fill="#1B2029">traffic light per requirement, top risks</text><path d="M1070,410 L1118,380" fill="none" stroke="#2F5F80" stroke-width="2" marker-end="url(#m2F5F80)"/><path d="M1070,440 L1118,470" fill="none" stroke="#2F5F80" stroke-width="2" marker-end="url(#m2F5F80)"/><text x="40" y="580" font-size="15" font-weight="700" fill="#1B2029">Finding verdicts</text><text x="40" y="606" font-size="14" font-weight="400" font-family="JetBrains Mono, Consolas, monospace" fill="#4A4F5A">supports_compliance · indicates_gap · inconclusive · not_assessable_by_testing</text><text x="40" y="640" font-size="14" font-weight="400" fill="#4A4F5A">Each MLflow run is tagged req_ids, card_version, kb_version, dataset_id. Thresholds are the organisation&#x27;s, not the law&#x27;s.</text><text x="40" y="664" font-size="14" font-weight="400" fill="#2F5F80">Every node and tool call is a Langfuse span: the judges can replay the whole run.</text></svg>
