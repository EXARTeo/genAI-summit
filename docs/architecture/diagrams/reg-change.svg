<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" viewBox="0 0 1500 640" font-family="Inter, &#x27;Segoe UI&#x27;, Arial, sans-serif"><defs><marker id="m2F5F80" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F5F80"/></marker><marker id="m2F5F80s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2F5F80"/></marker><marker id="m9E4A17" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9E4A17"/></marker><marker id="m9E4A17s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#9E4A17"/></marker><marker id="m1B2029" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1B2029"/></marker><marker id="m1B2029s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1B2029"/></marker><marker id="m4A4F5A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4A4F5A"/></marker><marker id="m4A4F5As" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#4A4F5A"/></marker></defs><rect x="0" y="0" width="1500" height="640" rx="0" fill="#F4F1EA"/><text x="40" y="52" font-size="28" font-weight="700" fill="#1B2029">Regulation change → re-review</text><text x="40" y="80" font-size="15" font-weight="400" fill="#4A4F5A">From a changed web page to a per-system decision and a delta report</text><rect x="40" y="120" width="230" height="120" rx="12" fill="#FBF9F4" stroke="#4A4F5A" stroke-width="2" stroke-dasharray="3 4"/><text x="54" y="148" font-size="17" font-weight="700" fill="#4A4F5A">Firecrawl monitor</text><text x="54" y="172" font-size="13.5" font-weight="400" fill="#1B2029">EUR-Lex, Service Desk,</text><text x="54" y="191" font-size="13.5" font-weight="400" fill="#4A4F5A">guideline pages</text><rect x="320" y="120" width="260" height="120" rx="12" fill="#F4F1EA" stroke="#9E4A17" stroke-width="2" stroke-dasharray="8 5"/><text x="334" y="148" font-size="17" font-weight="700" font-family="JetBrains Mono, Consolas, monospace" fill="#9E4A17">RKS: diff</text><text x="334" y="172" font-size="13.5" font-weight="400" fill="#1B2029">Re-parse document</text><text x="334" y="191" font-size="13.5" font-weight="400" fill="#4A4F5A">Provision-level diff</text><text x="334" y="210" font-size="13.5" font-weight="400" fill="#4A4F5A">by content_hash</text><rect x="630" y="120" width="260" height="120" rx="12" fill="#F4F1EA" stroke="#9E4A17" stroke-width="2" stroke-dasharray="8 5"/><text x="644" y="148" font-size="17" font-weight="700" font-family="JetBrains Mono, Consolas, monospace" fill="#9E4A17">RKS: classify</text><text x="644" y="172" font-size="13.5" font-weight="400" fill="#1B2029">LLM: editorial, substantive,</text><text x="644" y="191" font-size="13.5" font-weight="400" fill="#4A4F5A">date, scope, interpretation</text><text x="644" y="210" font-size="13.5" font-weight="400" fill="#4A4F5A">→ RegChange + kb_version</text><rect x="940" y="120" width="240" height="120" rx="12" fill="#F4F1EA" stroke="#9E4A17" stroke-width="2" stroke-dasharray="8 5"/><text x="954" y="148" font-size="17" font-weight="700" font-family="JetBrains Mono, Consolas, monospace" fill="#9E4A17">Impact index</text><text x="954" y="172" font-size="13.5" font-weight="400" fill="#1B2029">No LLM: provision →</text><text x="954" y="191" font-size="13.5" font-weight="400" fill="#4A4F5A">requirements → findings</text><text x="954" y="210" font-size="13.5" font-weight="400" fill="#4A4F5A">→ systems</text><rect x="1230" y="120" width="230" height="120" rx="12" fill="#F4F1EA" stroke="#2F5F80" stroke-width="2"/><text x="1244" y="148" font-size="17" font-weight="700" fill="#2F5F80">HITL</text><text x="1244" y="172" font-size="13.5" font-weight="400" fill="#1B2029">AI Officer accepts</text><text x="1244" y="191" font-size="13.5" font-weight="400" fill="#4A4F5A">new kb_version</text><path d="M270,180 L318,180" fill="none" stroke="#9E4A17" stroke-width="2" marker-end="url(#m9E4A17)"/><path d="M580,180 L628,180" fill="none" stroke="#9E4A17" stroke-width="2" marker-end="url(#m9E4A17)"/><path d="M890,180 L938,180" fill="none" stroke="#9E4A17" stroke-width="2" marker-end="url(#m9E4A17)"/><path d="M1180,180 L1228,180" fill="none" stroke="#9E4A17" stroke-width="2" marker-end="url(#m9E4A17)"/><path d="M1345,242 L1345,290 L160,290 L160,338" fill="none" stroke="#9E4A17" stroke-width="2" marker-end="url(#m9E4A17)"/><rect x="40" y="340" width="300" height="150" rx="12" fill="#F4F1EA" stroke="#9E4A17" stroke-width="2"/><text x="54" y="368" font-size="17" font-weight="700" font-family="JetBrains Mono, Consolas, monospace" fill="#9E4A17">Change judge</text><rect x="281.4" y="352" width="48.599999999999994" height="20" rx="10" fill="#e8dacc"/><text x="305.7" y="366" font-size="11" font-weight="600" text-anchor="middle" fill="#9E4A17">agents</text><text x="54" y="392" font-size="13.5" font-weight="400" fill="#1B2029">per (system, change)</text><text x="54" y="411" font-size="13.5" font-weight="400" fill="#4A4F5A">no_impact</text><text x="54" y="430" font-size="13.5" font-weight="400" fill="#4A4F5A">reinterpret_existing_evidence</text><text x="54" y="449" font-size="13.5" font-weight="400" fill="#4A4F5A">rerun_tests · new_tests_needed</text><rect x="390" y="340" width="300" height="150" rx="12" fill="#F4F1EA" stroke="#9E4A17" stroke-width="2"/><text x="404" y="368" font-size="17" font-weight="700" font-family="JetBrains Mono, Consolas, monospace" fill="#9E4A17">Notify</text><rect x="624.8" y="352" width="55.199999999999996" height="20" rx="10" fill="#e8dacc"/><text x="652.4" y="366" font-size="11" font-weight="600" text-anchor="middle" fill="#9E4A17">backend</text><text x="404" y="392" font-size="13.5" font-weight="400" fill="#1B2029">Platform inbox + Telegram</text><text x="404" y="411" font-size="13.5" font-weight="400" fill="#4A4F5A">summary, diff excerpt,</text><text x="404" y="430" font-size="13.5" font-weight="400" fill="#4A4F5A">decision per system</text><text x="404" y="449" font-size="13.5" font-weight="400" fill="#4A4F5A">[See diff] [Re-run SYS-001]</text><rect x="740" y="340" width="300" height="150" rx="12" fill="#F4F1EA" stroke="#9E4A17" stroke-width="2"/><text x="754" y="368" font-size="17" font-weight="700" font-family="JetBrains Mono, Consolas, monospace" fill="#9E4A17">Re-run</text><rect x="981.4" y="352" width="48.599999999999994" height="20" rx="10" fill="#e8dacc"/><text x="1005.7" y="366" font-size="11" font-weight="600" text-anchor="middle" fill="#9E4A17">agents</text><text x="754" y="392" font-size="13.5" font-weight="400" fill="#1B2029">Engineer pipeline again</text><text x="754" y="411" font-size="13.5" font-weight="400" fill="#4A4F5A">(also on override of</text><text x="754" y="430" font-size="13.5" font-weight="400" fill="#4A4F5A">no_impact → judge feedback)</text><rect x="1090" y="340" width="370" height="150" rx="12" fill="#FBF9F4" stroke="#2F5F80" stroke-width="2"/><text x="1104" y="368" font-size="17" font-weight="700" fill="#1B2029">Delta report</text><text x="1104" y="392" font-size="13.5" font-weight="400" fill="#1B2029">Which findings changed verdict</text><text x="1104" y="411" font-size="13.5" font-weight="400" fill="#4A4F5A">vs the previous kb_version,</text><text x="1104" y="430" font-size="13.5" font-weight="400" fill="#4A4F5A">and why</text><path d="M340,415 L388,415" fill="none" stroke="#9E4A17" stroke-width="2" marker-end="url(#m9E4A17)"/><path d="M690,415 L738,415" fill="none" stroke="#9E4A17" stroke-width="2" marker-end="url(#m9E4A17)"/><path d="M1040,415 L1088,415" fill="none" stroke="#9E4A17" stroke-width="2" marker-end="url(#m9E4A17)"/><text x="40" y="560" font-size="14" font-weight="400" fill="#4A4F5A">Old decisions are never rewritten: they are marked stale and keep the kb_version they were made with.</text><text x="40" y="586" font-size="14" font-weight="400" fill="#2F5F80">Demo trick: a mirrored guideline page we edit live, then &quot;Check now&quot; → Telegram alert in seconds.</text></svg>
