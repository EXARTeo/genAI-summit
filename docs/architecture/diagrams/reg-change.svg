<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" viewBox="0 0 1500 640" font-family="Inter, &#x27;Segoe UI&#x27;, Arial, sans-serif"><defs><marker id="m0F172A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker><marker id="m0F172As" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0F172A"/></marker><marker id="m64748B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="m64748Bs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#64748B"/></marker><marker id="m4F46E5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker><marker id="m4F46E5s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#4F46E5"/></marker><marker id="m14B8A6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#14B8A6"/></marker><marker id="m14B8A6s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#14B8A6"/></marker></defs><rect x="0" y="0" width="1500" height="640" rx="0" fill="#FFFFFF"/><text x="40" y="52" font-size="28" font-weight="700" fill="#0F172A">Regulation change → re-review</text><text x="40" y="80" font-size="15" font-weight="400" fill="#64748B">From a changed web page to a per-system decision and a delta report</text><rect x="40" y="120" width="230" height="120" rx="12" fill="#F5F5F7" stroke="#64748B" stroke-width="2" stroke-dasharray="3 4"/><text x="54" y="148" font-size="17" font-weight="700" fill="#64748B">Firecrawl monitor</text><text x="54" y="172" font-size="13.5" font-weight="400" fill="#0F172A">EUR-Lex, Service Desk,</text><text x="54" y="191" font-size="13.5" font-weight="400" fill="#64748B">guideline pages</text><rect x="320" y="120" width="260" height="120" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2" stroke-dasharray="8 5"/><text x="334" y="148" font-size="17" font-weight="700" font-family="JetBrains Mono, Consolas, monospace" fill="#4F46E5">RKS: diff</text><text x="334" y="172" font-size="13.5" font-weight="400" fill="#0F172A">Re-parse document</text><text x="334" y="191" font-size="13.5" font-weight="400" fill="#64748B">Provision-level diff</text><text x="334" y="210" font-size="13.5" font-weight="400" fill="#64748B">by content_hash</text><rect x="630" y="120" width="260" height="120" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2" stroke-dasharray="8 5"/><text x="644" y="148" font-size="17" font-weight="700" font-family="JetBrains Mono, Consolas, monospace" fill="#4F46E5">RKS: classify</text><text x="644" y="172" font-size="13.5" font-weight="400" fill="#0F172A">LLM: editorial, substantive,</text><text x="644" y="191" font-size="13.5" font-weight="400" fill="#64748B">date, scope, interpretation</text><text x="644" y="210" font-size="13.5" font-weight="400" fill="#64748B">→ RegChange + kb_version</text><rect x="940" y="120" width="240" height="120" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2" stroke-dasharray="8 5"/><text x="954" y="148" font-size="17" font-weight="700" font-family="JetBrains Mono, Consolas, monospace" fill="#4F46E5">Impact index</text><text x="954" y="172" font-size="13.5" font-weight="400" fill="#0F172A">No LLM: provision →</text><text x="954" y="191" font-size="13.5" font-weight="400" fill="#64748B">requirements → findings</text><text x="954" y="210" font-size="13.5" font-weight="400" fill="#64748B">→ systems</text><rect x="1230" y="120" width="230" height="120" rx="12" fill="#FFFFFF" stroke="#14B8A6" stroke-width="2"/><text x="1244" y="148" font-size="17" font-weight="700" fill="#14B8A6">HITL</text><text x="1244" y="172" font-size="13.5" font-weight="400" fill="#0F172A">AI Officer accepts</text><text x="1244" y="191" font-size="13.5" font-weight="400" fill="#64748B">new kb_version</text><path d="M270,180 L318,180" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#m4F46E5)"/><path d="M580,180 L628,180" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#m4F46E5)"/><path d="M890,180 L938,180" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#m4F46E5)"/><path d="M1180,180 L1228,180" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#m4F46E5)"/><path d="M1345,242 L1345,290 L160,290 L160,338" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#m4F46E5)"/><rect x="40" y="340" width="300" height="150" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/><text x="54" y="368" font-size="17" font-weight="700" font-family="JetBrains Mono, Consolas, monospace" fill="#4F46E5">Change judge</text><rect x="281.4" y="352" width="48.599999999999994" height="20" rx="10" fill="#e6e5fb"/><text x="305.7" y="366" font-size="11" font-weight="600" text-anchor="middle" fill="#4F46E5">agents</text><text x="54" y="392" font-size="13.5" font-weight="400" fill="#0F172A">per (system, change)</text><text x="54" y="411" font-size="13.5" font-weight="400" fill="#64748B">no_impact</text><text x="54" y="430" font-size="13.5" font-weight="400" fill="#64748B">reinterpret_existing_evidence</text><text x="54" y="449" font-size="13.5" font-weight="400" fill="#64748B">rerun_tests · new_tests_needed</text><rect x="390" y="340" width="300" height="150" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/><text x="404" y="368" font-size="17" font-weight="700" font-family="JetBrains Mono, Consolas, monospace" fill="#4F46E5">Notify</text><rect x="624.8" y="352" width="55.199999999999996" height="20" rx="10" fill="#e6e5fb"/><text x="652.4" y="366" font-size="11" font-weight="600" text-anchor="middle" fill="#4F46E5">backend</text><text x="404" y="392" font-size="13.5" font-weight="400" fill="#0F172A">Platform inbox + Telegram</text><text x="404" y="411" font-size="13.5" font-weight="400" fill="#64748B">summary, diff excerpt,</text><text x="404" y="430" font-size="13.5" font-weight="400" fill="#64748B">decision per system</text><text x="404" y="449" font-size="13.5" font-weight="400" fill="#64748B">[See diff] [Re-run SYS-001]</text><rect x="740" y="340" width="300" height="150" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/><text x="754" y="368" font-size="17" font-weight="700" font-family="JetBrains Mono, Consolas, monospace" fill="#4F46E5">Re-run</text><rect x="981.4" y="352" width="48.599999999999994" height="20" rx="10" fill="#e6e5fb"/><text x="1005.7" y="366" font-size="11" font-weight="600" text-anchor="middle" fill="#4F46E5">agents</text><text x="754" y="392" font-size="13.5" font-weight="400" fill="#0F172A">Engineer pipeline again</text><text x="754" y="411" font-size="13.5" font-weight="400" fill="#64748B">(also on override of</text><text x="754" y="430" font-size="13.5" font-weight="400" fill="#64748B">no_impact → judge feedback)</text><rect x="1090" y="340" width="370" height="150" rx="12" fill="#F5F5F7" stroke="#14B8A6" stroke-width="2"/><text x="1104" y="368" font-size="17" font-weight="700" fill="#0F172A">Delta report</text><text x="1104" y="392" font-size="13.5" font-weight="400" fill="#0F172A">Which findings changed verdict</text><text x="1104" y="411" font-size="13.5" font-weight="400" fill="#64748B">vs the previous kb_version,</text><text x="1104" y="430" font-size="13.5" font-weight="400" fill="#64748B">and why</text><path d="M340,415 L388,415" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#m4F46E5)"/><path d="M690,415 L738,415" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#m4F46E5)"/><path d="M1040,415 L1088,415" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#m4F46E5)"/><text x="40" y="560" font-size="14" font-weight="400" fill="#64748B">Old decisions are never rewritten: they are marked stale and keep the kb_version they were made with.</text><text x="40" y="586" font-size="14" font-weight="400" fill="#14B8A6">Demo trick: a mirrored guideline page we edit live, then &quot;Check now&quot; → Telegram alert in seconds.</text></svg>
