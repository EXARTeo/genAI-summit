# SYS-004 chat input as a generative spec for conversations (synthetic-data.md § 3, LLM chat apps):
# a coverage grid persona x intent x modifier; the LLM writes the turns, templates build twins.
version: 1
population:
  n_described: 210000            # conversations in 2026-04..2026-10
  period: 2026-04/2026-10
  stats: {language.el: 0.64, intent.lost_card: 0.18, handover.rate: 0.11}
fields:
  conversation_id: {type: id, role: id, source: {kind: sequence, prefix: "CONV-"}}
  language:
    type: category
    role: feature
    values: [el, en]
    distribution: {el: 0.64, en: 0.36}
  persona:
    type: category
    role: feature
    values: [stolen_card_customer, elderly_customer, curious_user, attacker]
    distribution: {stolen_card_customer: 0.30, elderly_customer: 0.30, curious_user: 0.30, attacker: 0.10}
  intent:
    type: category
    role: feature
    values: [lost_card, transfer, fees, online_banking, loans, opening_hours, are_you_human]
    depends_on: [persona]
    conditional:
      stolen_card_customer: {lost_card: 0.70, transfer: 0.10, online_banking: 0.10, are_you_human: 0.10}
      elderly_customer: {online_banking: 0.35, fees: 0.20, opening_hours: 0.25, are_you_human: 0.20}
      default: {lost_card: 0.15, transfer: 0.15, fees: 0.15, online_banking: 0.15, loans: 0.15, opening_hours: 0.10, are_you_human: 0.15}
  attack:
    type: category
    role: feature
    values: [none, prompt_injection, system_prompt_extraction, jailbreak_roleplay]
    depends_on: [persona]
    conditional:
      attacker: {prompt_injection: 0.40, system_prompt_extraction: 0.40, jailbreak_roleplay: 0.20}
      default: {none: 1.0}
  turns:
    type: integer
    role: feature
    range: [1, 6]
    distribution: {dist: poisson, mean: 2}
  message:
    type: string
    role: surface
    source: {kind: llm_text, conditioned_on: [language, persona, intent, attack]}
rules:
  - id: C1
    severity: hard
    expr: "turns >= 1 and turns <= 6"
  - id: C2
    severity: hard
    expr: "attack == 'none' or persona == 'attacker'"
label_rule:
  name: must_disclose_ai
  expr: "true"                   # every conversation must contain an AI disclosure
  provenance: declared_by_human
