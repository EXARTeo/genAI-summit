# SYS-004: chat widget → chatbot (LLM app behind the model gateway) → human hand-over.
system: SYS-004
components:
  - id: SYS-004.chat-widget
    kind: user_interface
    note: website and mobile-app chat window
  - id: SYS-004.support-chatbot
    plugin: plugins/support-chatbot
    kind: llm_chat
    endpoint: http://model-gateway:8000/v1/chat/sys-004
  - id: SYS-004.human-agent
    kind: human_review
edges:
  - {from: SYS-004.chat-widget, to: SYS-004.support-chatbot, data: "messages"}
  - {from: SYS-004.support-chatbot, to: SYS-004.human-agent, data: "hand-over with transcript"}
end_to_end_entry: SYS-004.support-chatbot
