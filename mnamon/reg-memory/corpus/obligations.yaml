# Obligation catalogue (plan 01 §3.2): what a PROVIDER of a high-risk AI system must do under
# the consolidated AI Act (02024R1689, post-Omnibus 2026/1744), plus the two duties every
# operator has (Art. 4 AI literacy, Art. 5 prohibited practices) and the Art. 50(1)/(2)
# transparency duties (gated by system features). Deployer duties (Art. 26, 27, 86) are out
# of scope for the MVP (plan 01 P9).
#
# Schema and validation: engine/kb/obligations.py. Snapshotted into every kb release
# (obligations.yaml next to requirements.yaml); every `article` / `related` id must exist in
# the release's provisions (release warnings list any that do not).
#
#   applies_if  role x risk class x basis family x Annex III point x features x 6(3) claim.
#               Empty list = no condition. exempt_6_3: false = only when the system does NOT
#               claim the Art. 6(3) derogation; true = only when it does; null = either way.
#   in_force    per basis family (annex_iii, annex_i) or `any`, post-Omnibus dates.
#   checks      what a test must establish: metric family, test templates
#               (corpus/test_templates.yaml), where the pass threshold comes from (always the
#               organisation's, never the law's: plan 01 P10).
#   requirements  the requirements.yaml entries this obligation covers (load_context keeps
#               working on requirements; the obligation map is the new backbone).
# Drafted from the downloaded text; every entry still needs human review.

# ---- Every operator ---------------------------------------------------------------------

- id: OBL.AIA.4.ai-literacy
  article: AIA.4
  addressee: [provider, deployer]
  applies_if: {}
  in_force: {any: 2025-02-02}
  verification_mode: documentary
  evidence_types: [training_records, ai_literacy_policy]
  summary: Ensure a sufficient level of AI literacy of staff dealing with the AI system.

- id: OBL.AIA.5.prohibited-practices-screening
  article: AIA.5.1
  related: [AIA.5.1.a, AIA.5.1.b, AIA.5.1.c, AIA.5.1.f, AIA.5.1.g]
  addressee: [provider, deployer]
  applies_if: {}
  in_force: {any: 2025-02-02}
  verification_mode: documentary
  evidence_types: [prohibited_practices_screening]
  summary: >-
    Screen the system against the prohibited practices (manipulation, exploitation of
    vulnerabilities, social scoring, emotion recognition at work, biometric categorisation).

- id: OBL.AIA.4a.special-category-data
  article: AIA.4a.1
  related: [AIA.4a.2, AIA.10.2.f]
  addressee: [provider]
  applies_if: {risk_class: [high]}
  in_force: {any: 2025-02-02}
  verification_mode: documentary
  evidence_types: [special_category_data_safeguards, dpia]
  requirements: [REQ.AIA.4a.1.special-category-data-safeguards]
  summary: >-
    Special categories of personal data used to detect and correct bias only when strictly
    necessary, with the safeguards of Art. 4a (pseudonymisation, access control, deletion).

