# Iris question for the regulation change judge (pipeline/impact.py). Same
# options as prompts/change_judge.md; Iris scores them, the code writes the text.
decision:
  type: choice
  instructions: >-
    What does `change` mean for this AI system's existing evidence (`findings`, `tests`), given
    `impacted_requirements` and `changed_cited_provisions`?
  criteria:
    no_impact: >-
      The change touches no requirement the findings or tests rely on, or only its wording
      changed.
    reinterpret_existing_evidence: >-
      The test results still stand, but their reading against the law changes (a threshold, a
      scope, a date).
    rerun_tests: The requirement behind existing tests changed in substance; the same tests must run again.
    new_tests_needed: The change creates an obligation or a case no existing test covers.
