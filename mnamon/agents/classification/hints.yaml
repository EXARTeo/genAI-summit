# Words that suggest learning or inference; none of them in the description ->
# ai_system_doubt (the agent must address Art. 3(1)).
ai_system_words: [ai, model, models, machine learning, learning, learned, learns, trained, training, neural, llm, inference, infers, predict, predicts, prediction, predictions, classifier, classifies, classify, generative, gpt, gemini, scoring, score, recommend, recommends, recommendation, ranking, ranks, nlp, language model, deep learning, statistical, extract, extracts, extraction]

# How the system was obtained (wizard step 1) -> role hint (Art. 3(3), 3(4), 25(1)).
# The first group whose word appears in the answer wins; default provider.
acquisition_roles:
  - role: provider_by_art25
    words: [changed, modified, modify, rebranded, rebrand, substantial modification, bought_and_changed, bought_changed, adapted]
  - role: deployer
    words: [as_is, as is, bought, licensed, licence, license, third_party, third-party, vendor, purchased]
  - role: provider
    words: [in_house, in-house, inhouse, built, developed, own]
