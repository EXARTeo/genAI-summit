# Mnamon Copilot: the engineer's EU AI Act compliance copilot in the chat.
# Grounded in the product's own data: the regulation (reg-memory, pinned to the
# active kb_version), the system folders and the audits, read through the
# backend's API. Writes (a proposed note, a new audit) ask the user first.
id: mnamon
slug: mnamon
name: Mnamon Copilot
version: 1.0.0
type: deep_agent
description: >-
  Your EU AI Act compliance copilot: explains the regulation with citations, a
  system's dossier and plugins, and an audit's findings, tests, critic and report
icon: Scale
prompt: ./AGENT.md
model:
  main: google_genai:${GEMINI_MODEL}    # GEMINI_MODEL from .env
all_mcp_tools: false    # answers come from the knowledge base, not the open web
tools:
  - native: list_systems
  - native: list_system_files
  - native: read_system_file
  - native: list_audits
  - native: read_audit
  - native: read_audit_artifact
  - native: list_findings
  - native: get_gate_decisions
  - native: list_obligations
  - native: lookup_provision
  - native: search_regulation
  - native: list_kb_releases
  - native: diff_kb
  - native: list_reg_changes
  - native: get_reg_change
  - native: audit_needs_rerun
  - native: propose_system_note
  - native: attach_upload_to_audit_draft
  - native: start_audit
subagents:
  - name: audit-analyst
    description: >-
      Explains one audit (or compares two): its pins and kb_version, results,
      findings and gaps, the human decisions at each gate, the critic and the
      report. Returns facts with the audit id and kb_version.
    prompt: ./subagents/audit-analyst.md
    tools:
      - native: list_audits
      - native: read_audit
      - native: read_audit_artifact
      - native: list_findings
      - native: get_gate_decisions
      - native: read_system_file
  - name: regulation-historian
    description: >-
      Regulation versions and change: which kb_version an audit used, what
      changed between releases, a regulation change and its judged impact, and
      whether an audit needs a re-run (audit_needs_rerun).
    prompt: ./subagents/regulation-historian.md
    tools:
      - native: read_audit
      - native: list_audits
      - native: list_kb_releases
      - native: diff_kb
      - native: list_reg_changes
      - native: get_reg_change
      - native: audit_needs_rerun
      - native: lookup_provision
  - name: regulation-researcher
    description: >-
      Answers one question about the EU AI Act and its guidance from the
      knowledge base: finds the provisions, reads them, returns the answer
      with each provision id and kb_version.
    prompt: ./subagents/regulation-researcher.md
    tools:
      - native: lookup_provision
      - native: search_regulation
  - name: test-designer
    description: >-
      Helps the engineer design an audit: scenarios tied to obligation ids, a
      dummy or uploaded dataset spec, an optional sandbox preview, then a
      focused or custom start_audit (the user approves each write).
    prompt: ./subagents/test-designer.md
    tools:
      - native: list_systems
      - native: list_system_files
      - native: read_system_file
      - native: list_obligations
      - native: list_kb_releases
      - native: lookup_provision
      - native: attach_upload_to_audit_draft
      - native: start_audit
  - name: evidence-analyst
    description: >-
      Re-checks one finding or number against an audit's saved evidence (its
      artifacts, predictions and test results): recomputes in the sandbox,
      returns what holds, what does not and the counter-arguments.
    prompt: ./subagents/evidence-analyst.md
    tools:
      - native: read_audit
      - native: read_audit_artifact
      - native: list_findings
      - native: read_system_file
hitl:
  task: false                 # delegating to sub-agents needs no approval
  propose_system_note: true   # a note in the system folder
  attach_upload_to_audit_draft: true   # a chat upload copied into datasets/uploaded/
  start_audit: true           # a new audit run
  execute: true               # the sandbox (locked on anyway)
