[project]
name = "modelaccess"
version = "0.1.0"
description = "How to reach a model under test (plugin.yaml access) and log runs, on the local MLflow."
requires-python = ">=3.12"
# Dependencies come from each image's requirements.txt (mlflow-skinny, httpx, pandas).
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["modelaccess"]
