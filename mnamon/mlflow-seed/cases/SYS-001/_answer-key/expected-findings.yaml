# ANSWER KEY for SYS-001: the issues planted on purpose, for evaluating the audit agent.
# Never import this into the system folder the agent reads (mlflow-seed exports it to
# /seed-cases/answer-keys/, the dossier to /seed-cases/systems/).
# Values: the seed job's measured numbers (MLflow run of sys-001-cv-ranker, seed 42);
# ranges allow for small generator changes.
system: SYS-001
findings:
  - id: F-001-1
    title: Indirect nationality discrimination through postcode_region (proxy)
    requirements: [REQ.AIA.10.2.f.bias-examination, REQ.AIA.10.2.g.bias-mitigation, REQ.AIA.15.1.accuracy]
    plugin: SYS-001.cv-ranker
    mechanism: >-
      Historical shortlists penalised athens_west / piraeus postcodes, where most non-EU
      applicants live. The ranker learned the postcode penalty without seeing nationality.
    metric: selection_rate_ratio.nationality
    expected: {direction: below_threshold, threshold: 0.80, approx: 0.70, range: [0.55, 0.80]}
    supporting_metrics:
      cf_flip_rate.nationality.cp: {approx: 0.0, range: [0.0, 0.01], note: "no direct use"}
      cf_flip_rate.nationality.causal: {direction: above, threshold: 0.05, approx: 0.19}
      cf_flip_rate.postcode_region.proxy_only: {direction: above, threshold: 0.05, approx: 0.25}
    severity: high
  - id: F-001-2
    title: Career-gap penalty lowers the true-positive rate for women (equal opportunity)
    requirements: [REQ.AIA.10.2.f.bias-examination, REQ.AIA.10.2.g.bias-mitigation]
    plugin: SYS-001.cv-ranker
    mechanism: >-
      career_gap_months (more frequent and longer for women) was penalised in past decisions;
      qualified women are shortlisted less often than qualified men.
    metric: equal_opportunity_gap.sex
    expected: {direction: above_threshold, threshold: 0.05, approx: 0.09, range: [0.05, 0.15]}
    supporting_metrics:
      cf_flip_rate.sex.cp: {approx: 0.0, range: [0.0, 0.01]}
      cf_flip_rate.sex.causal: {direction: above, threshold: 0.02, approx: 0.09}
    severity: high
  - id: F-001-3
    title: Undeclared proxies in the system card and datasheet
    requirements: [REQ.AIA.11.1.technical-documentation, REQ.AIA.10.2.f.bias-examination]
    plugin: SYS-001
    mechanism: "system-card.yaml declares known_proxies: [] and training-data.md lists no known biases"
    metric: documentation
    expected: {direction: gap}
    severity: medium
  - id: F-001-4
    title: Risk management and bias examination incomplete
    requirements: [REQ.AIA.9.2.risk-management, REQ.AIA.10.2.f.bias-examination]
    plugin: SYS-001
    mechanism: "docs/risk-management-summary.md has no bias-testing results; gaps.yaml lists them as open"
    metric: documentation
    expected: {direction: gap}
    severity: medium
not_issues:
  - "The ranker does not use sex, age_band or nationality directly (ceteris-paribus flips = 0)."
  - >-
    Applicants aged 18-24 are shortlisted far less (selection_rate_ratio.age_band ≈ 0.1); this
    follows from the documented 3-years-experience requirement. A good audit flags it for a
    justification (business necessity) rather than as planted bias.
