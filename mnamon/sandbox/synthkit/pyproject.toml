[project]
name = "synthkit"
version = "0.1.0"
description = "Deterministic synthetic test data for model audits: profile, generate, analyze."
requires-python = ">=3.12"
# Dependencies come from the sandbox image's requirements.txt (pinned there).
dependencies = []

[project.scripts]
synthkit = "synthkit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["synthkit"]
