; reg-memory suite (product/reg-memory). Runs with the service's own venv, not
; the repo tooling env:  product/reg-memory/.venv/Scripts/python -m pytest tests/reg_memory
; This file makes tests/reg_memory its own pytest root, so the repo-level
; tests/conftest.py and pyproject settings do not apply here.
[pytest]
testpaths = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
timeout = 60
addopts = -ra --strict-markers -p no:cacheprovider
