; mlflow-seed suite (mnamon/mlflow-seed). Runs with the job's own venv, not the repo
; tooling env:  mnamon/mlflow-seed/.venv/Scripts/python -m pytest tests/mlflow_seed
; This file makes tests/mlflow_seed its own pytest root, so the repo-level
; tests/conftest.py and pyproject settings do not apply here.
[pytest]
testpaths = .
addopts = -ra --strict-markers -p no:cacheprovider
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::FutureWarning
