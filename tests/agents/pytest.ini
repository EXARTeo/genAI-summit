; Agents-service suite (mnamon/agents). Runs with the agents service's own
; venv, not the repo tooling env:
;   mnamon/agents/.venv/Scripts/python -m pytest tests/agents
; This file makes tests/agents its own pytest root, so the repo-level
; tests/conftest.py and pyproject settings do not apply here.
[pytest]
testpaths = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
timeout = 60
addopts = -ra --strict-markers -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning:fakeredis.*
