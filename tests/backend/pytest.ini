; Backend suite (product/backend). Runs with the backend's own venv, not the
; repo tooling env:  product/backend/.venv/Scripts/python -m pytest tests/backend
; This file makes tests/backend its own pytest root, so the repo-level
; tests/conftest.py and pyproject settings do not apply here.
[pytest]
testpaths = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
timeout = 60
addopts = -ra --strict-markers -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning:fakeredis.*
