; model-gateway suite (mnamon/model-gateway). Runs with the service's own venv, not
; the repo tooling env:  mnamon/model-gateway/.venv/Scripts/python -m pytest tests/model_gateway
; This file makes tests/model_gateway its own pytest root, so the repo-level
; tests/conftest.py and pyproject settings do not apply here.
[pytest]
testpaths = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
timeout = 60
addopts = -ra --strict-markers -p no:cacheprovider
