; sandbox suite (mnamon/sandbox: runner + synthkit). Runs with the service's own
; venv, not the repo tooling env:
;   mnamon/sandbox/.venv/Scripts/python -m pytest tests/sandbox
; This file makes tests/sandbox its own pytest root, so the repo-level
; tests/conftest.py and pyproject settings do not apply here.
[pytest]
testpaths = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
timeout = 180
addopts = -ra --strict-markers -p no:cacheprovider
